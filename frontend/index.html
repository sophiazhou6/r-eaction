<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>r/eaction</title>
<link rel="stylesheet" href="styles.css?v=10">
</head>
<body>
<div class="home" id="home">
  <button class="icon" data-theme-btn title="Toggle light / dark"></button>
  <div class="hcenter">
    <div class="hwm"><b>r/</b>eaction</div>
    <div class="htag">See how Reddit is reading the news.</div>
    <form class="hsearch" id="hform">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="hq" placeholder="Search a specific news event, e.g. FAA flight cuts" autocomplete="off">
    </form>
    <div class="herr" id="herr"></div>
    <div class="htry" id="htry"></div>
  </div>
  <div class="hfoot" id="hfoot"></div>
</div>
<div class="app">
  <section class="left">
  <header>
    <div class="wm" id="homeLink" title="Home"><b>r/</b>eaction</div>
    <div class="ev">
      <h1><span id="evTitle"></span> <span class="tag" id="evTag">sample data</span></h1>
      <div class="q" id="question"></div>
    </div>
    <div class="seg" id="modeSeg"><button data-mode="narrative" class="on">Narrative</button><button data-mode="stance">Stance</button></div>
  </header>
    <div class="stage" id="stage">
      <div class="missing" id="missing"></div>
      <canvas id="cv"></canvas>
      <div class="top">
        <div id="crumbs" style="display:flex;align-items:center;gap:10px"></div>
      </div>
      <div class="slegend" id="slegend" style="display:none"></div>
      <div class="tip" id="tip"></div>
    </div>
  </section>
  <aside>
    <div class="rtop">
      <div class="search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" placeholder="Search a specific news event, e.g. FAA flight cuts" autocomplete="off">
        <div class="dd" id="dd"></div>
      </div>
      <button class="icon" data-theme-btn title="Toggle light / dark"></button>
    </div>
    <div id="panel"></div>
  </aside>
</div>
<script src="app.js?v=10"></script>
<script src="timeline.js?v=10"></script>
<script src="live.js?v=10"></script>
</body>
</html>
